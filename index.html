<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    width:400px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

input,select{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h2 align="center">Registration Form</h2>

<form action="success.html"  method="post">

<input type="text" id="name" placeholder="Enter Name" required>

<input type="email" id="email" placeholder="Enter Email" required>

<input type="password" id="password" placeholder="Enter Password" required>

<input type="number" id="age" placeholder="Enter Age" min="1" max="99" oninput="this.value=this.value.slice(0,2)"required>

<input type="text" id="phone" placeholder="Enter Phone Number" maxlength="10" pattern="[0-9]{10}" inputmode="numeric" required>

<select id="gender">
<option value="">Select Gender</option>
<option value="Male" >Male</option>
<option value="Female" >Female</option>
<option value="other" >Other</option>
</select>
<a href="success.html">
<button type="button">Register</button>
</a>
</form>
</div>

</body>
</html>
